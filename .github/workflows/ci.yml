name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        features: [headless, tray]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev pkg-config libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev libasound2-dev
      - run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --locked ${{ matrix.features == 'tray' && '--features tray' || '--no-default-features' }} -- -D warnings
      - name: Unit tests
        run: cargo test --locked ${{ matrix.features == 'tray' && '--features tray' || '--no-default-features' }}
      - name: Release build
        run: cargo build --release --locked ${{ matrix.features == 'tray' && '--features tray' || '--no-default-features' }}
      - name: TCP integration (Unix)
        if: runner.os != 'Windows'
        run: python tests/integration.py target/release/boncasrelay
      - name: TCP integration (Windows)
        if: runner.os == 'Windows'
        run: python tests/integration.py target/release/boncasrelay.exe
      - name: Connection limits (Unix)
        if: runner.os != 'Windows'
        run: python tests/server_limits.py target/release/boncasrelay
      - name: Connection limits (Windows)
        if: runner.os == 'Windows'
        run: python tests/server_limits.py target/release/boncasrelay.exe
      - uses: actions/upload-artifact@v4
        with:
          name: boncasrelay-${{ runner.os }}-${{ matrix.features }}
          path: target/release/boncasrelay${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error
