; UTF-8. Existing General/CardReader/CardPort keys are retained for migration.
[General]
ListenAddress=0.0.0.0
ServerPort=6900
; Repeat Allow for each trusted client or subnet. Empty means all hosts.
Allow=192.168.1.0/24
Verbose=false

[CardReader]
; Exact reader name or unique substring; empty enables automatic detection.
BCAS=
ACAS=

[CardPort]
; Optional fixed listener: PORT=reader name
; 6902=Example Reader

[Web]
Listen=127.0.0.1:6980
Enabled=true
Token=
